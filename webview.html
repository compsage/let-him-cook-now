<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{panelTitle}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--vscode-font-family);
            background-color: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
        }

        .gif-container {
            position: relative;
            background: var(--vscode-editor-background);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .gif-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .countdown-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, #FF6B6B, #FFD93D);
            animation: countdown {{displayDuration}}s linear;
            width: 100%;
            z-index: 10;
        }

        @keyframes countdown {
            from { width: 100%; }
            to { width: 0%; }
        }

        .music-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(76, 175, 80, 0.9);
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 20;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            opacity: 0;
        }

        /* Show on hover when paused */
        .gif-container:hover .music-btn {
            opacity: 1;
        }

        /* Always show when playing - red stop button */
        .music-btn.playing {
            opacity: 1;
            background: rgba(244, 67, 54, 0.9);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 6px 24px rgba(244, 67, 54, 0.8);
                transform: scale(1.15);
            }
        }

        .music-btn:hover {
            transform: scale(1.1);
        }

        .music-btn:not(.playing):hover {
            background: rgba(76, 175, 80, 1);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }

        .music-btn.playing:hover {
            background: rgba(244, 67, 54, 1);
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.4);
        }

        .music-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gif-container">
            {{countdownBar}}
            <button class="music-btn" id="playBtn" onclick="playMusic()" title="Play cooking soundtrack">▶</button>
            <button class="like-btn" id="likeBtn" onclick="toggleLike()" title="Like this GIF">
                <span id="likeIcon">♡</span>
                <span id="likeCount">0</span>
            </button>
            <audio id="audioPlayer" style="display: none;"></audio>
            <img id="gifImage" src="" alt="Loading..." style="display: none;">
            <div id="loadingIndicator" style="display: flex; justify-content: center; align-items: center; min-height: 200px; color: var(--vscode-editor-foreground);">
                <p>Loading GIF... 🔥</p>
            </div>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const gifImage = document.getElementById('gifImage');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const countdownBar = document.getElementById('countdownBar');
        let isPlaying = false;
        let currentGifId = null;
        let pendingMusicRequest = false;

        const applyButtonUI = (playing) => {
            if (playing) {
                playBtn.textContent = '⏹';
                playBtn.title = 'Stop cooking soundtrack';
                playBtn.classList.add('playing');
            } else {
                playBtn.textContent = '▶';
                playBtn.title = 'Play cooking soundtrack';
                playBtn.classList.remove('playing');
            }
        };

        const setPlayingState = (playing, notifyExtension = true) => {
            const stateChanged = isPlaying !== playing;
            isPlaying = playing;
            applyButtonUI(playing);

            if (notifyExtension && stateChanged) {
                vscode.postMessage({ command: playing ? 'musicStarted' : 'musicStopped' });
            }
        };

        const stopPlayback = (notifyExtension = true) => {
            pendingMusicRequest = false;
            if (audioPlayer.src) {
                audioPlayer.pause();
                audioPlayer.currentTime = 0;
            }
            setPlayingState(false, notifyExtension);
        };

        const requestRandomMusic = () => {
            pendingMusicRequest = true;
            vscode.postMessage({ command: 'getRandomMusic' });
        };

        // Ensure button starts hidden (paused state)
        applyButtonUI(false);

        function getNewGif() {
            // Show loading state
            loadingIndicator.style.display = 'flex';
            gifImage.style.display = 'none';
            vscode.postMessage({ command: 'getNewGif' });
        }

        function playMusic() {
            console.log('playMusic invoked, isPlaying:', isPlaying, 'pending request:', pendingMusicRequest);
            if (isPlaying || pendingMusicRequest) {
                stopPlayback();
            } else {
                requestRandomMusic();
            }
        }

        function restartCountdown(duration) {
            if (countdownBar && duration) {
                // Force restart animation with new duration
                countdownBar.style.animation = 'none';
                // Force reflow to ensure animation restarts
                countdownBar.offsetHeight;
                countdownBar.style.animation = `countdown ${duration}s linear`;
            }
        }

        // Listen for messages from the extension
        window.addEventListener('message', event => {
            const message = event.data;

            if (message.command === 'updateGif') {
                // Update GIF
                currentGifId = message.gifId;
                gifImage.src = message.gifUrl;
                gifImage.alt = message.title;
                gifImage.style.display = 'block';
                loadingIndicator.style.display = 'none';

                // Restart countdown animation if autoplay is enabled
                if (message.autoPlay && message.displayDuration) {
                    restartCountdown(message.displayDuration);
                }
            }

            if (message.command === 'gifError') {
                loadingIndicator.innerHTML = '<p>😕 ' + message.error + '</p>';
                gifImage.style.display = 'none';
            }

            if (message.command === 'musicLoaded') {
                console.log('Music loaded:', message.title);
                console.log('Music URL:', message.musicUrl);

                if (!pendingMusicRequest) {
                    console.log('No pending music request. Ignoring musicLoaded response.');
                    return;
                }

                pendingMusicRequest = false;

                // Set the source and play
                audioPlayer.src = message.musicUrl;
                audioPlayer.volume = 0.25; // Start at 25% volume

                // Play audio - user gesture context is preserved from button click
                console.log('Playing audio (user gesture preserved from HTML button click)...');
                audioPlayer.play().then(() => {
                    setPlayingState(true);
                    console.log('✓ Audio started playing successfully!');
                }).catch(err => {
                    console.error('✗ Error playing audio:', err.message);
                    console.error('Full error:', err);
                    stopPlayback();
                });

                // Play next random song when current one ends
                audioPlayer.onended = () => {
                    console.log('Song ended, getting new music');
                    stopPlayback();
                    // Auto-play next song
                    requestRandomMusic();
                };

                audioPlayer.onerror = (error) => {
                    console.error('Audio error:', error);
                    stopPlayback();
                };
            }

            if (message.command === 'musicError') {
                console.error('Music error:', message.error);
                stopPlayback();
            }

            if (message.command === 'toggleMusic') {
                playMusic();
            }

            if (message.command === 'stopMusic') {
                stopPlayback();
            }
        });

        // Keyboard shortcut
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                getNewGif();
            }
        });
    </script>
</body>
</html>
