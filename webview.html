<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{panelTitle}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--vscode-font-family);
            background-color: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
        }

        .gif-container {
            position: relative;
            background: var(--vscode-editor-background);
            overflow: hidden;
        }

        .gif-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .countdown-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, #FF6B6B, #FFD93D);
            animation: countdown {{displayDuration}}s linear;
            width: 100%;
            z-index: 10;
        }

        @keyframes countdown {
            from { width: 100%; }
            to { width: 0%; }
        }

        .music-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 107, 107, 0.9);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 20;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            opacity: 0;
        }

        .gif-container:hover .music-btn {
            opacity: 1;
        }

        .music-btn:hover {
            background: rgba(255, 107, 107, 1);
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }

        .music-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gif-container">
            {{countdownBar}}
            <button class="music-btn" id="playBtn" onclick="playMusic()" title="Play Music">▶</button>
            <audio id="audioPlayer" style="display: none;"></audio>
            <img id="gifImage" src="" alt="Loading..." style="display: none;">
            <div id="loadingIndicator" style="display: flex; justify-content: center; align-items: center; min-height: 200px; color: var(--vscode-editor-foreground);">
                <p>Loading GIF... 🔥</p>
            </div>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const gifImage = document.getElementById('gifImage');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const countdownBar = document.getElementById('countdownBar');
        let isPlaying = false;
        let currentGifId = null;

        function getNewGif() {
            // Show loading state
            loadingIndicator.style.display = 'flex';
            gifImage.style.display = 'none';
            vscode.postMessage({ command: 'getNewGif' });
        }

        function playMusic() {
            console.log('playMusic called DIRECTLY from HTML button, isPlaying:', isPlaying);
            if (isPlaying) {
                // Pause music
                console.log('Pausing music');
                audioPlayer.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
                playBtn.title = 'Play Music';
            } else {
                // Fetch a new random song when play is clicked
                console.log('Requesting new music from direct user click');
                vscode.postMessage({ command: 'getRandomMusic' });
            }
        }

        function restartCountdown(duration) {
            if (countdownBar && duration) {
                // Force restart animation with new duration
                countdownBar.style.animation = 'none';
                // Force reflow to ensure animation restarts
                countdownBar.offsetHeight;
                countdownBar.style.animation = `countdown ${duration}s linear`;
            }
        }

        // Listen for messages from the extension
        window.addEventListener('message', event => {
            const message = event.data;

            if (message.command === 'updateGif') {
                // Update GIF
                currentGifId = message.gifId;
                gifImage.src = message.gifUrl;
                gifImage.alt = message.title;
                gifImage.style.display = 'block';
                loadingIndicator.style.display = 'none';

                // Restart countdown animation if autoplay is enabled
                if (message.autoPlay && message.displayDuration) {
                    restartCountdown(message.displayDuration);
                }
            }

            if (message.command === 'gifError') {
                loadingIndicator.innerHTML = '<p>😕 ' + message.error + '</p>';
                gifImage.style.display = 'none';
            }

            if (message.command === 'musicLoaded') {
                console.log('Music loaded:', message.title);
                console.log('Music URL:', message.musicUrl);

                // Set the source and play
                audioPlayer.src = message.musicUrl;
                audioPlayer.volume = 0.5; // Start at 50% volume

                // Play audio - user gesture context is preserved from button click
                console.log('Playing audio (user gesture preserved from HTML button click)...');
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '⏸';
                    playBtn.title = 'Stop Music';
                    console.log('✓ Audio started playing successfully!');
                }).catch(err => {
                    console.error('✗ Error playing audio:', err.message);
                    console.error('Full error:', err);
                    playBtn.textContent = '▶';
                    playBtn.title = 'Play Music';
                });

                // Play next random song when current one ends
                audioPlayer.onended = () => {
                    console.log('Song ended, getting new music');
                    isPlaying = false;
                    playBtn.textContent = '▶';
                    playBtn.title = 'Play Music';
                    // Auto-play next song
                    vscode.postMessage({ command: 'getRandomMusic' });
                };
            }

            if (message.command === 'musicError') {
                console.error('Music error:', message.error);
                isPlaying = false;
                vscode.postMessage({ command: 'musicStopped' });
            }
        });

        // Keyboard shortcut
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                getNewGif();
            }
        });
    </script>
</body>
</html>
